<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting…</title>
</head>
<body>
  <script>
    // 딜레이 후 리다이렉트(디버깅 용이성 확보) 및 안전한 fallback 처리
    setTimeout(() => {
      try {
        window.location.replace('https://godsaeng.streamlit.app/');
      } catch (e) {
        window.location.href = 'https://godsaeng.streamlit.app/';
      }
    }, 500);
  </script>
  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;padding:16px;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Nanum Gothic', Arial, sans-serif;">
      <a href="https://godsaeng.streamlit.app/" target="_blank" rel="noopener noreferrer" style="font-size:1.1rem;">여기를 클릭하면 Godsaeng으로 이동합니다.</a>
    </div>
  </noscript>
</body>
</html>
