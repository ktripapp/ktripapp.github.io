---
layout: default
---

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap');

  :root {
    --gold:    #f5a623;
    --gold-lt: #ffd37a;
    --dark:    #0d0f14;
    --card:    #161a22;
    --card2:   #1c2130;
    --border:  #2a3045;
    --text:    #e2e6f0;
    --muted:   #7a859e;
    --up:      #22d4a0;
    --down:    #f05252;
    --radius:  14px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 16px;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .post-wrapper {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  /* ── Hero ── */
  .post-hero {
    position: relative;
    padding: 52px 0 40px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 48px;
    overflow: hidden;
  }

  .post-hero::before {
    content: '';
    position: absolute;
    top: -60px; right: -80px;
    width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(245,166,35,.13) 0%, transparent 70%);
    pointer-events: none;
  }

  .post-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(245,166,35,.12);
    border: 1px solid rgba(245,166,35,.3);
    color: var(--gold);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 18px;
  }

  .post-badge::before { content: '₿'; font-size: 13px; }

  .post-hero h1 {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 900;
    line-height: 1.3;
    color: #fff;
    margin-bottom: 16px;
    letter-spacing: -.02em;
  }

  .post-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .post-meta time {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
  }

  .post-tags { display: flex; flex-wrap: wrap; gap: 6px; }

  .post-tags .tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .05em;
    padding: 3px 9px;
    border-radius: 20px;
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ── Body ── */
  .post-body { font-size: 16px; color: #ccd3e0; line-height: 1.9; }

  .post-body h2 {
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    margin: 52px 0 18px;
    padding: 0 0 14px;
    border-bottom: 2px solid var(--border);
    position: relative;
    letter-spacing: -.01em;
  }

  .post-body h2::before {
    content: '';
    position: absolute;
    bottom: -2px; left: 0;
    width: 48px; height: 2px;
    background: var(--gold);
    border-radius: 2px;
  }

  .post-body h3 {
    font-size: 16px;
    font-weight: 700;
    color: var(--gold-lt);
    margin: 28px 0 10px;
  }

  .post-body p { margin-bottom: 20px; }
  .post-body strong { color: #fff; font-weight: 700; }

  .post-body blockquote {
    margin: 36px 0;
    padding: 14px 20px;
    background: var(--card2);
    border-left: 3px solid var(--gold);
    border-radius: 0 var(--radius) var(--radius) 0;
    color: var(--muted);
    font-size: 14px;
  }
  .post-body blockquote p { margin: 0; }

  .post-body hr { border: none; border-top: 1px solid var(--border); margin: 40px 0; }

  .post-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 28px 0;
    font-size: 14px;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--border);
  }

  .post-body th {
    background: var(--card2);
    color: var(--gold);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 12px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  .post-body td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: top;
  }

  .post-body tr:last-child td { border-bottom: none; }
  .post-body tr:nth-child(odd) td { background: rgba(255,255,255,.02); }

  .post-body ul, .post-body ol { padding-left: 22px; margin-bottom: 20px; }
  .post-body li { margin-bottom: 6px; }

  .post-body code {
    background: var(--card2);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 13px;
    color: var(--gold-lt);
    font-family: 'SF Mono', 'Fira Code', monospace;
  }

  /* ── Tags footer ── */
  .post-tags-footer {
    margin-top: 56px;
    padding-top: 28px;
    border-top: 1px solid var(--border);
  }

  .post-tags-footer .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .post-tags-footer .tags-list { display: flex; flex-wrap: wrap; gap: 8px; }

  .post-tags-footer .tags-list .tag {
    font-size: 12px;
    padding: 5px 13px;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    font-weight: 500;
    transition: all .18s ease;
    cursor: default;
  }

  .post-tags-footer .tags-list .tag:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(245,166,35,.08);
  }

  /* ── Comments ── */
  .post-comments {
    margin-top: 60px;
    padding-top: 40px;
    border-top: 1px solid var(--border);
  }

  .post-comments .comments-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .utterances { max-width: 100% !important; }

  @media (max-width: 600px) {
    .post-hero { padding: 36px 0 28px; }
    .post-body h2 { font-size: 18px; }
    .post-body table { font-size: 13px; }
  }
</style>

<div class="post-wrapper">

  <header class="post-hero">
    <div class="post-badge">비트코인 시장 분석</div>
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">
        {{ page.date | date: "%Y년 %-m월 %-d일" }}
      </time>
      {% if page.tags %}
      <div class="post-tags">
        {% for tag in page.tags limit:4 %}
        <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
      {% endif %}
    </div>
  </header>

  <article class="post-body">
    {{ content }}
  </article>

  {% if page.tags %}
  <div class="post-tags-footer">
    <div class="label">Tags</div>
    <div class="tags-list">
      {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
  </div>
  {% endif %}

  <section class="post-comments">
    <div class="comments-label">Comments</div>
    <div id="utterances-thread"></div>
    <script src="https://utteranc.es/client.js"
            repo="ktripapp/ktripapp.github.io"
            issue-term="title"
            theme="github-dark"
            crossorigin="anonymous"
            async>
    </script>
  </section>

</div>
