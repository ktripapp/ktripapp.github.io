---
layout: default
---

<article>
  <h2>{{ page.title }}</h2>
  <p><small>{{ page.date | date: "%Y-%m-%d" }}</small></p>
  {{ content }}
</article>

<section id="comments">
  <div id="utterances-thread"></div>
  <script src="https://utteranc.es/client.js"
          repo="ktripapp/ktripapp.github.io"
          issue-term="title"
          theme="github-light"
          crossorigin="anonymous"
          async>
  </script>
</section>
